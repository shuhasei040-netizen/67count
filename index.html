<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>67 Counter</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#n{display:inline-block;font-size:clamp(100px,30vw,360px);font-weight:900;line-height:1;text-shadow:0 4px 30px #000,0 0 8px #000}
#n.pop{animation:pop .1s ease-out}
@keyframes pop{0%{transform:scale(1.18);color:#fbbf24}100%{transform:scale(1)}}
.center{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#arrow{font-size:36px;text-shadow:0 2px 10px #000;height:44px}
.top{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 10px max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.b{padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(15,23,42,.75);font-weight:700;font-size:14px}
.b.on{background:#f59e0b;color:#0f172a;border-color:#f59e0b}
.b.sq{width:44px;height:44px;padding:0;font-size:18px}
.pill{font-size:12px;padding:5px 10px;border-radius:99px;background:rgba(15,23,42,.75);border:1px solid rgba(255,255,255,.2)}
label{font-size:12px;display:flex;align-items:center;gap:6px;background:rgba(15,23,42,.75);padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.25)}
input[type=range]{width:110px;accent-color:#f59e0b}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:#0f172a;color:#fbbf24;font-weight:700;line-height:1.7}
#msg:empty{display:none}
</style>
<script>
/* ページ解析より先にカメラ取得を開始（＝瞬時起動） */
(function(){
  var T=[{video:{facingMode:'user',width:{ideal:640},height:{ideal:480},frameRate:{ideal:60}},audio:false},
         {video:{facingMode:'user'},audio:false},{video:true,audio:false}];
  window.__open=async function(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('unsupported');
    var last;
    for(var i=0;i<T.length;i++){
      try{return await navigator.mediaDevices.getUserMedia(T[i]);}
      catch(e){last=e;if(e&&(e.name==='NotAllowedError'||e.name==='NotReadableError'))break;}
    }
    throw last;
  };
  window.__cam=window.__open();
  window.__cam.catch(function(){});
})();
</script>
</head>
<body>
<video id="v" autoplay playsinline muted></video>

<div class="center"><div id="n">0</div><div id="arrow">・</div></div>

<div class="top">
  <span class="pill" id="fps">-- fps</span>
  <span style="display:flex;gap:8px">
    <button class="b sq" id="snd" title="サウンド (M)">🔊</button>
    <button class="b sq" id="fs" title="全画面 (F)">⛶</button>
  </span>
</div>

<div class="bar">
  <button class="b on" id="m67">67 交互</button>
  <button class="b" id="m1">上下</button>
  <label>感度 高<input type="range" id="lv" min="1" max="10" value="3">低</label>
  <button class="b" id="rs">リセット</button>
</div>

<div id="msg">カメラを起動中…</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const video=$('v'), nEl=$('n'), msgEl=$('msg'), arrow=$('arrow');

/* ---------- 設定 ---------- */
const W=48, H=36;            // 解析解像度（小さいほど速い／大きな動きに強い）
const MINPX=6, EPS=100, MIN_INT=25;
let count=0, mode='67', sound=true;
let mth=12, vth=.14;         // 動き画素のしきい値 / 折返し判定の速度しきい値
function setLv(){const lv=+$('lv').value; mth=6+2*lv; vth=.05+.03*lv;}

/* ---------- サウンド ---------- */
let actx=null, lastSnd=0;
function audio(){
  if(!actx){const A=window.AudioContext||window.webkitAudioContext; if(A)actx=new A();}
  if(actx&&actx.state==='suspended')actx.resume().catch(()=>{});
  return actx;
}
['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,audio,{once:true,passive:true}));
function beep(){
  if(!sound)return; const n=performance.now(); if(n-lastSnd<35)return; lastSnd=n;
  const c=audio(); if(!c)return;
  try{
    const o=c.createOscillator(),g=c.createGain(),t=c.currentTime,f=480+(count%15)*25;
    o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*1.3,t+.05);
    g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.01,t+.05);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.06);
  }catch(e){}
}

/* ---------- 動き解析（縦方向オプティカルフロー）----------
   映像を小さくしてフレーム差分から縦方向の速度を推定。
   手を「検出」しないので、ブレていても動きが読める。 */
const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
const cx=cv.getContext('2d',{willReadFrequently:true});
let prev=new Float32Array(W*H), cur=new Float32Array(W*H), hasPrev=false;
const clamp=v=>v>8?8:v<-8?-8:v;

function analyze(t){
  cx.drawImage(video,0,0,W,H);
  const d=cx.getImageData(0,0,W,H).data;
  for(let i=0,j=0;i<W*H;i++,j+=4)cur[i]=d[j]*.299+d[j+1]*.587+d[j+2]*.114;
  if(hasPrev){
    let aL=0,bL=0,nL=0,aR=0,bR=0,nR=0; const half=W>>1;
    for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
      const i=y*W+x, it=cur[i]-prev[i];
      if(it<mth&&it>-mth)continue;                      // 動いていない画素は無視
      const iy=((cur[i+W]-cur[i-W])+(prev[i+W]-prev[i-W]))*.25;
      if(x<half){aL+=iy*it;bL+=iy*iy;nL++;}else{aR+=iy*it;bR+=iy*iy;nR++;}
    }
    const vL=nL>=MINPX?clamp(-aL/(bL+EPS)):0;           // +が下方向(px/frame)
    const vR=nR>=MINPX?clamp(-aR/(bR+EPS)):0;
    const nA=nL+nR, vA=nA>=MINPX?clamp(-(aL+aR)/(bL+bR+EPS)):0;
    if(nA>=MINPX)lastMove=t;
    step(mode==='67'?(vL-vR)*.5:vA,t);
  }
  const tmp=prev;prev=cur;cur=tmp;hasPrev=true;
}

/* ---------- カウント（速度の向きが反転するたびに+1）---------- */
let dir=0, sv=0, lastMove=0, lastFire=0, dirty=false;
function step(v,t){
  if(t-lastMove>500){dir=0;sv=0;}
  sv=sv*.4+v*.6;
  if(dir===0){if(sv>vth)dir=1;else if(sv<-vth)dir=-1;}
  else if(dir===1&&sv<-vth){dir=-1;fire(t);}
  else if(dir===-1&&sv>vth){dir=1;fire(t);}
  arrow.textContent=sv>vth?'▼':sv<-vth?'▲':'・';
}
function fire(t){
  if(t-lastFire<MIN_INT)return;
  lastFire=t; count++; dirty=true; beep();
}

/* ---------- フレームループ（カメラの全フレームを処理）---------- */
let gen=0, lastTime=-1, frames=0, fpsT=performance.now();
function loop(){
  const g=++gen;
  const sched=cb=>video.requestVideoFrameCallback?video.requestVideoFrameCallback(cb):requestAnimationFrame(cb);
  const tick=()=>{
    if(g!==gen)return;
    if(video.readyState>=2&&video.videoWidth&&video.currentTime!==lastTime){
      lastTime=video.currentTime; frames++;
      analyze(performance.now());
      if(dirty){dirty=false;nEl.textContent=count;nEl.classList.remove('pop');void nEl.offsetWidth;nEl.classList.add('pop');}
    }
    const n=performance.now();
    if(n-fpsT>=1000){$('fps').textContent=Math.round(frames*1000/(n-fpsT))+' fps';frames=0;fpsT=n;}
    sched(tick);
  };
  sched(tick);
}

/* ---------- カメラ ---------- */
let stream=null;
async function start(first){
  msgEl.textContent='カメラを起動中…';
  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await(first?window.__cam:window.__open());
    stream.getVideoTracks()[0].addEventListener('ended',()=>{msgEl.textContent='カメラが切断されました。タップで再接続';});
    video.srcObject=stream;
    await video.play().catch(()=>{});
    hasPrev=false; dir=0; msgEl.textContent=''; loop();
  }catch(e){
    msgEl.textContent=(window.isSecureContext?'カメラを許可してください（他のアプリが使用中の場合は閉じてください）':'https:// または localhost で開いてください')+'\n\nタップで再試行';
    msgEl.style.whiteSpace='pre-line';
  }
}
msgEl.addEventListener('click',()=>start(false));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  const t=stream&&stream.getVideoTracks()[0];
  if(!t||t.readyState==='ended')start(false);else{video.play().catch(()=>{});loop();}
});

/* ---------- UI ---------- */
function setMode(m){mode=m;$('m67').classList.toggle('on',m==='67');$('m1').classList.toggle('on',m!=='67');dir=0;sv=0;}
function reset(){count=0;nEl.textContent=0;dir=0;sv=0;}
$('m67').onclick=()=>setMode('67');
$('m1').onclick=()=>setMode('1');
$('lv').oninput=setLv;
$('rs').onclick=reset;
$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?'🔊':'🔇';audio();};
const root=document.documentElement;
function toggleFS(){
  if(document.fullscreenElement||document.webkitFullscreenElement){
    (document.exitFullscreen||document.webkitExitFullscreen).call(document);
  }else{
    const r=root.requestFullscreen||root.webkitRequestFullscreen;
    if(r)r.call(root);
  }
}
if(!(root.requestFullscreen||root.webkitRequestFullscreen))$('fs').style.display='none';
$('fs').onclick=toggleFS;
video.addEventListener('dblclick',toggleFS);
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='f')toggleFS();else if(k==='r')reset();else if(k==='m')$('snd').click();
});

setLv();
start(true);
})();
</script>
</body>
</html>
