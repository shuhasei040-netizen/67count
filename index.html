<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>67 Counter</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#v,#ov{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#ov{image-rendering:pixelated;pointer-events:none;opacity:.6}
#n{display:inline-block;font-size:clamp(100px,30vw,360px);font-weight:900;line-height:1;text-shadow:0 4px 30px #000,0 0 8px #000}
#n.pop{animation:pop .09s ease-out}
@keyframes pop{0%{transform:scale(1.15);color:#fbbf24}100%{transform:scale(1)}}
.center{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#arrow{font-size:30px;text-shadow:0 2px 10px #000;height:44px;color:#fbbf24}
.top{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center}
#gr{position:fixed;left:10px;top:calc(max(10px,env(safe-area-inset-top)) + 38px);width:150px;height:46px;border-radius:8px;background:rgba(15,23,42,.7);border:1px solid rgba(255,255,255,.2);pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 10px max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.b{padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(15,23,42,.75);font-weight:700;font-size:14px}
.b.on{background:#f59e0b;color:#0f172a;border-color:#f59e0b}
.b.sq{width:44px;height:44px;padding:0;font-size:18px}
.pill{font-size:12px;padding:5px 10px;border-radius:99px;background:rgba(15,23,42,.8);border:1px solid rgba(255,255,255,.2)}
label{font-size:12px;display:flex;align-items:center;gap:6px;background:rgba(15,23,42,.75);padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.25)}
input[type=range]{width:120px;accent-color:#f59e0b}
#tm{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 38px);left:50%;transform:translateX(-50%);font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 2px 10px #000;display:none;pointer-events:none;padding:2px 14px;border-radius:99px;background:rgba(15,23,42,.7)}
#ch{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;background:rgba(0,0,0,.6);z-index:5;padding:24px}
#ch.on{display:flex}
#ch.cd{pointer-events:none;background:rgba(0,0,0,.25)}
#ch .big{font-size:clamp(90px,28vw,260px);font-weight:900;color:#fbbf24;line-height:1;text-shadow:0 4px 30px #000}
#ch .sub{font-size:18px;font-weight:700;white-space:pre-line;line-height:1.7;text-shadow:0 2px 10px #000}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:#0f172a;color:#fbbf24;font-weight:700;line-height:1.7;white-space:pre-line}
#msg:empty{display:none}
</style>
<script>
/* ページ解析より先に「カメラ取得」と「手検出AI」の読込を同時開始 */
(function(){
  var T=[{video:{facingMode:'user',width:{ideal:640},height:{ideal:480},frameRate:{ideal:120,min:30}},audio:false},
         {video:{facingMode:'user',frameRate:{ideal:60}},audio:false},
         {video:{facingMode:'user'},audio:false},{video:true,audio:false}];
  window.__open=async function(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('unsupported');
    var last;
    for(var i=0;i<T.length;i++){
      try{return await navigator.mediaDevices.getUserMedia(T[i]);}
      catch(e){last=e;if(e&&(e.name==='NotAllowedError'||e.name==='NotReadableError'))break;}
    }
    throw last;
  };
  window.__cam=window.__open();
  window.__cam.catch(function(){});
  window.__handsLib=new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js';
    s.async=true;s.crossOrigin='anonymous';s.onload=res;s.onerror=rej;document.head.appendChild(s);
  });
  window.__handsLib.catch(function(){});
})();
</script>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<canvas id="ov"></canvas>

<div class="center"><div id="n">0</div><div id="arrow">・</div></div>

<div class="top">
  <span class="pill" id="st">-- fps</span>
  <span style="display:flex;gap:8px">
    <button class="b sq" id="ovb" title="判定表示 ON/OFF">👁</button>
    <button class="b sq" id="snd" title="サウンド (M)">🔊</button>
    <button class="b sq" id="fs" title="全画面 (F)">⛶</button>
  </span>
</div>
<canvas id="gr" width="150" height="46"></canvas>
<div id="tm">10.0</div>
<div id="ch"><div class="big" id="chb"></div><div class="sub" id="chs"></div>
  <div id="chbtn" style="display:none;gap:8px"><button class="b on" id="again">もう一度</button><button class="b" id="close">閉じる</button></div></div>

<div class="bar">
  <label>感度 高<input type="range" id="lv" min="1" max="10" value="2">低</label>
  <button class="b" id="ten" title="10秒で何回できるか挑戦 (T)">⏱ 10秒</button>
  <button class="b" id="fast" title="露光を短くして残像を減らす（対応端末のみ）">⚡高速カメラ</button>
  <button class="b" id="rs">リセット</button>
</div>

<div id="msg">カメラを起動中…</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const video=$('v'), nEl=$('n'), msgEl=$('msg'), arrow=$('arrow'), ov=$('ov'), ovx=ov.getContext('2d'), gr=$('gr'), grx=gr.getContext('2d');

/* ---------- 設定 ---------- */
const WID=96,        // 解析解像度（横）
      MIN_INT=40,    // 連続カウントの最小間隔(ms)
      HOLD=1500,     // 手の判定エリアを残す時間(ms)
      OUTW=.3,       // 判定エリア外の動きの重み（手検出が外れても止まらない）
      HANDS_INT=150; // 手検出AIを走らせる間隔(ms)
let count=0, sound=true, ovOn=true;
const DUR=10000, ch={state:'idle',end:0,timer:0};   // 10秒チャレンジ
let dth=5, minR=.14, holdMs=HOLD;
function setLv(){const lv=+$('lv').value; dth=3+lv; minR=.04+.05*lv;}

/* ---------- サウンド ---------- */
let actx=null, lastSnd=0;
function audio(){
  if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A({latencyHint:'interactive'});}
  if(actx&&actx.state==='suspended')actx.resume().catch(()=>{});
  return actx;
}
['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,audio,{once:true,passive:true}));
function beep(){
  if(!sound)return;const n=performance.now();if(n-lastSnd<30)return;lastSnd=n;
  const c=audio();if(!c)return;
  try{
    const o=c.createOscillator(),g=c.createGain(),t=c.currentTime,f=480+(count%15)*25;
    o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.3,t+.04);
    g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.01,t+.04);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.05);
  }catch(e){}
}
function tone(f,d){
  if(!sound)return;const c=audio();if(!c)return;
  try{
    const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
    o.frequency.value=f;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.01,t+d);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}

/* =====================================================================
   ① 手の場所を探す（MediaPipe Hands）… 動きを見るエリアの「補助」
      外れても止まらない（エリア外も重みを下げて見る）
   ===================================================================== */
const slots=[{h:[]},{h:[]}];
let hands=null, aiReady=false, aiFailed=false, busy=false, busySince=0;
(async function(){
  try{
    await window.__handsLib;
    hands=new window.Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/'+f});
    hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.3,minTrackingConfidence:.3});
    hands.onResults(onHands);
    await hands.initialize();
    aiReady=true;
  }catch(e){console.error(e);aiFailed=true;}
})();
function onHands(res){
  const t=performance.now(), L=res.multiHandLandmarks||[];
  const boxes=L.map(l=>{
    let x0=1,y0=1,x1=0,y1=0;
    for(const p of l){if(p.x<x0)x0=p.x;if(p.x>x1)x1=p.x;if(p.y<y0)y0=p.y;if(p.y>y1)y1=p.y;}
    return {x0,y0,x1,y1};
  }).sort((a,b)=>(a.x0+a.x1)-(b.x0+b.x1));
  if(boxes.length>=2){put(0,boxes[0],t);put(1,boxes[boxes.length-1],t);}
  else if(boxes.length===1){
    const b=boxes[0],cxb=(b.x0+b.x1)/2,live=[0,1].filter(k=>roiOf(slots[k],t));
    let k;
    if(live.length===2){k=Math.abs(cxb-cenX(roiOf(slots[0],t)))<=Math.abs(cxb-cenX(roiOf(slots[1],t)))?0:1;}
    else if(live.length===1){k=Math.abs(cxb-cenX(roiOf(slots[live[0]],t)))<.25?live[0]:1-live[0];}
    else k=cxb<.5?0:1;
    put(k,b,t);
  }
}
function put(k,b,t){slots[k].h.push({t,x0:b.x0,y0:b.y0,x1:b.x1,y1:b.y1});}
const cenX=r=>(r.x0+r.x1)/2;
function roiOf(s,now){
  const h=s.h;while(h.length&&now-h[0].t>holdMs)h.shift();
  if(!h.length)return null;
  let x0=1,y0=1,x1=0,y1=0;
  for(const e of h){if(e.x0<x0)x0=e.x0;if(e.y0<y0)y0=e.y0;if(e.x1>x1)x1=e.x1;if(e.y1>y1)y1=e.y1;}
  return {x0:Math.max(0,x0-.15),y0:Math.max(0,y0-.3),x1:Math.min(1,x1+.15),y1:Math.min(1,y1+.3)};
}

/* =====================================================================
   ② 「縦方向の動きの強さ」を毎フレーム1つの数値にする
      ・直前フレームとの差分のうち、縦方向の動き（横向きの縁のズレ）だけを重視
      ・手の位置は測らない → ブレ・暗さ・低画質・超高速でも波が残る
      ・上下に1回動くたびに、この強さは「強→弱→強」と1往復する
   ===================================================================== */
let W=0,H=0,cg,pg,m,cv,cx,ovImg,ready=false,hasPrev=false,state='';
function init(vw,vh){
  W=WID;H=2*Math.round(W*vh/vw/2);
  cg=new Float32Array(W*H);pg=new Float32Array(W*H);m=new Uint8Array(W*H);
  cv=document.createElement('canvas');cv.width=W;cv.height=H;
  cx=cv.getContext('2d',{willReadFrequently:true});
  ov.width=W;ov.height=H;ovImg=ovx.createImageData(W,H);
  hasPrev=false;ready=true;
}
const HN=120, hist=new Float32Array(HN); let hp=0;

function analyze(t){
  cx.drawImage(video,0,0,W,H);
  const d=cx.getImageData(0,0,W,H).data, n=W*H;
  for(let i=0,j=0;i<n;i++,j+=4)cg[i]=.299*d[j]+.587*d[j+1]+.114*d[j+2];
  if(!hasPrev)pg.set(cg);
  let gp=0;for(let i=0;i<n;i++)gp+=cg[i]-pg[i];gp/=n;        // 画面全体の明るさ変化（自動露出など）を除去

  m.fill(0);
  const rois=[roiOf(slots[0],t),roiOf(slots[1],t)];
  const useRoi=aiReady&&!!(rois[0]||rois[1]);
  if(useRoi)for(let k=0;k<2;k++){
    const r=rois[k];if(!r)continue;
    const x0=Math.floor(r.x0*W),x1=Math.ceil(r.x1*W),y0=Math.floor(r.y0*H),y1=Math.ceil(r.y1*H);
    for(let y=y0;y<y1&&y<H;y++)for(let x=x0;x<x1&&x<W;x++)m[y*W+x]=1;
  }
  state=!aiReady?(aiFailed?'AIなし：全画面':'AI準備中：全画面'):useRoi?'手を追跡中':'手未検出：全画面';

  const od=ovOn?ovImg.data:null;if(od)od.fill(0);
  let E=0;
  for(let y=1;y<H-1;y++){
    const row=y*W;
    for(let x=1;x<W-1;x++){
      const i=row+x;
      let dd=cg[i]-pg[i]-gp;if(dd<0)dd=-dd;
      dd-=dth;if(dd<=0)continue;
      if(dd>60)dd=60;
      let ix=cg[i+1]-cg[i-1];if(ix<0)ix=-ix;
      let iy=cg[i+W]-cg[i-W];if(iy<0)iy=-iy;
      let c=dd*iy/(ix+iy+6);                 // 縦方向の動きを重視（横の動きは弱める）
      if(useRoi&&!m[i])c*=OUTW;
      E+=c;
      if(od&&c>1.5){const k=i<<2;od[k]=255;od[k+2]=200;od[k+3]=230;}
    }
  }
  const e=E/n;
  stepE(e,t);
  hist[hp]=e;hp=(hp+1)%HN;

  if(ovOn){
    ovx.putImageData(ovImg,0,0);
    if(useRoi){ovx.strokeStyle='#22c55e';ovx.lineWidth=1;
      for(const r of rois)if(r)ovx.strokeRect(r.x0*W+.5,r.y0*H+.5,(r.x1-r.x0)*W-1,(r.y1-r.y0)*H-1);}
    gr.style.display='';drawGraph();
  }else{ovx.clearRect(0,0,W,H);gr.style.display='none';}
  pg.set(cg);hasPrev=true;
}

/* ---------- カウント：動きの強さの波が「谷から立ち上がる」たびに+1 ---------- */
let eHi=0,eLo=0,eDir=0,eExt=0,thrLine=0,lastFire=0,dirty=false;
function resetDet(){eHi=eLo=0;eDir=0;eExt=0;}
function stepE(e,t){
  // 直近の最大・最小を追って、波の大きさ(range)を知る
  eHi=e>eHi?e:eHi+(e-eHi)*.05;
  eLo=e<eLo?e:eLo+(e-eLo)*.05;
  const range=eHi-eLo;
  if(range<minR){eDir=0;eExt=e;thrLine=eLo+range*.5;arrow.textContent='・';return;}   // 動きが小さい間は数えない
  const th=range*.17;                         // 波の大きさに対する相対しきい値（サンプルが粗くても追従）
  if(eDir<=0){                                // 谷を探している
    if(e<eExt)eExt=e;
    else if(e-eExt>th){eDir=1;eExt=e;fire(t);}
  }else{                                      // 山を探している
    if(e>eExt)eExt=e;
    else if(eExt-e>th){eDir=-1;eExt=e;}
  }
  thrLine=eDir<=0?eExt+th:eExt-th;
  arrow.textContent=eDir===1?'◆':'・';
}
const fireLog=[];
function fire(t){
  if(ch.state==='count'||ch.state==='done')return;          // チャレンジの準備中・終了後は数えない
  if(ch.state==='run'&&t>ch.end)return;                     // 10秒を過ぎたら数えない
  if(t-lastFire<MIN_INT)return;lastFire=t;count++;dirty=true;fireLog.push(t);beep();
}

function drawGraph(){
  const w=gr.width,h=gr.height;grx.clearRect(0,0,w,h);
  const sc=1/Math.max(eHi,minR*2);
  grx.strokeStyle='#38bdf8';grx.lineWidth=1.5;grx.beginPath();
  for(let k=0;k<HN;k++){
    const v=hist[(hp+k)%HN],x=k*w/(HN-1),y=h-2-Math.min(1,v*sc)*(h-4);
    if(k)grx.lineTo(x,y);else grx.moveTo(x,y);
  }
  grx.stroke();
  const ty=h-2-Math.min(1,Math.max(0,thrLine)*sc)*(h-4);
  grx.strokeStyle='#fbbf24';grx.lineWidth=1;grx.beginPath();grx.moveTo(0,ty);grx.lineTo(w,ty);grx.stroke();
}

/* ---------- フレームループ（カメラの全フレームを処理）---------- */
let gen=0,lastTime=-1,frames=0,fpsT=performance.now(),lastHands=0;
function loop(){
  const g=++gen;hasPrev=false;
  const sched=cb=>video.requestVideoFrameCallback?video.requestVideoFrameCallback(cb):requestAnimationFrame(cb);
  const tick=()=>{
    if(g!==gen)return;
    const now=performance.now();
    if(video.readyState>=2&&video.videoWidth&&video.currentTime!==lastTime){
      if(!ready)init(video.videoWidth,video.videoHeight);
      lastTime=video.currentTime;frames++;
      if(busy&&now-busySince>1500)busy=false;
      holdMs=(now-lastFire<600)?8000:HOLD;            // 高速カウント中は判定エリアを長く保持
      analyze(now);
      if(dirty){dirty=false;nEl.textContent=count;nEl.classList.remove('pop');void nEl.offsetWidth;nEl.classList.add('pop');}
      if(aiReady&&!busy&&now-lastFire>350&&now-lastHands>=HANDS_INT){   // 高速カウント中はAIを止めてフレーム落ちを防ぐ
        lastHands=now;busy=true;busySince=now;hands.send({image:video}).catch(()=>{}).then(()=>{busy=false;});}
    }
    if(now-fpsT>=1000){while(fireLog.length&&now-fireLog[0]>1000)fireLog.shift();$('st').textContent=Math.round(frames*1000/(now-fpsT))+' fps ・ '+fireLog.length+'回/秒 ・ '+state+camNote;frames=0;fpsT=now;}
    sched(tick);
  };
  sched(tick);
}

/* ---------- カメラ ---------- */
let stream=null, fast=false, camNote='';
async function applyFast(){
  const tr=stream&&stream.getVideoTracks()[0];if(!tr)return;
  camNote='';
  try{
    const cap=tr.getCapabilities?tr.getCapabilities():{};
    const adv={};
    if(fast){
      if(cap.exposureMode&&cap.exposureMode.includes('manual')&&cap.exposureTime){
        adv.exposureMode='manual';
        adv.exposureTime=Math.max(cap.exposureTime.min,Math.min(cap.exposureTime.max,40)); // 約4ms
        if(cap.iso)adv.iso=cap.iso.min+(cap.iso.max-cap.iso.min)*.7;
      }else camNote=' ・露出制御に非対応';
      if(cap.frameRate)adv.frameRate=cap.frameRate.max;
    }else if(cap.exposureMode&&cap.exposureMode.includes('continuous')){adv.exposureMode='continuous';}
    if(Object.keys(adv).length)await tr.applyConstraints({advanced:[adv]});
  }catch(e){camNote=' ・カメラ設定に失敗';}
}
async function start(first){
  msgEl.textContent='カメラを起動中…';
  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await(first?window.__cam:window.__open());
    stream.getVideoTracks()[0].addEventListener('ended',()=>{msgEl.textContent='カメラが切断されました。タップで再接続';});
    video.srcObject=stream;
    await video.play().catch(()=>{});
    ready=false;hasPrev=false;resetDet();msgEl.textContent='';loop();if(fast)applyFast();
  }catch(e){
    msgEl.textContent=(window.isSecureContext?'カメラを許可してください（他のアプリが使用中の場合は閉じてください）':'https:// または localhost で開いてください')+'\n\nタップで再試行';
  }
}
msgEl.addEventListener('click',()=>start(false));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  const t=stream&&stream.getVideoTracks()[0];
  if(!t||t.readyState==='ended')start(false);else{video.play().catch(()=>{});loop();}
});

/* ---------- UI ---------- */
function reset(){count=0;nEl.textContent=0;resetDet();}
$('lv').oninput=setLv;
$('rs').onclick=reset;
$('fast').onclick=()=>{fast=!fast;$('fast').classList.toggle('on',fast);applyFast();};
$('ovb').onclick=()=>{ovOn=!ovOn;$('ovb').style.opacity=ovOn?1:.45;};
$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?'🔊':'🔇';audio();};
const root=document.documentElement;
function toggleFS(){
  if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
  else{const r=root.requestFullscreen||root.webkitRequestFullscreen;if(r)r.call(root);}
}
if(!(root.requestFullscreen||root.webkitRequestFullscreen))$('fs').style.display='none';
$('fs').onclick=toggleFS;
video.addEventListener('dblclick',toggleFS);
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='f')toggleFS();else if(k==='t')chStart();else if(k==='r')reset();else if(k==='m')$('snd').click();
});

/* ---------- 10秒チャレンジ ---------- */
let best=0;try{best=+localStorage.getItem('best10')||0;}catch(e){}
function chStart(){
  clearInterval(ch.timer);audio();
  ch.state='count';reset();
  $('ch').className='on cd';$('chbtn').style.display='none';$('chs').textContent='準備して！';
  let k=3;$('chb').textContent=k;tone(600,.12);
  $('tm').style.display='block';$('tm').textContent='10.0';
  ch.timer=setInterval(()=>{
    k--;
    if(k>0){$('chb').textContent=k;tone(600,.12);}
    else{clearInterval(ch.timer);chGo();}
  },800);
}
function chGo(){
  reset();ch.state='run';ch.end=performance.now()+DUR;
  $('ch').className='';tone(1000,.25);
  ch.timer=setInterval(()=>{
    const left=ch.end-performance.now();
    if(left<=0)chFinish();else $('tm').textContent=(left/1000).toFixed(1);
  },40);
}
function chFinish(){
  clearInterval(ch.timer);ch.state='done';
  $('tm').textContent='0.0';tone(500,.4);
  const n=count,nb=n>best;
  if(nb){best=n;try{localStorage.setItem('best10',String(n));}catch(e){}}
  $('chb').textContent=n+'回';
  $('chs').textContent='10秒で '+n+'回（'+(n/10).toFixed(1)+'回/秒）\n'+(nb?'🎉 ベスト更新！':'ベスト '+best+'回');
  $('chbtn').style.display='flex';$('ch').className='on';
}
function chClose(){
  clearInterval(ch.timer);ch.state='idle';
  $('ch').className='';$('tm').style.display='none';
}
$('ten').onclick=chStart;
$('again').onclick=chStart;
$('close').onclick=chClose;

setLv();
start(true);
})();
</script>
</body>
</html>
