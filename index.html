<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>67 Hand Counter</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,"Noto Sans JP",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1) scale(var(--z,1))}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000c;z-index:5;color:#f59e0b;font-weight:700}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
#hud button{pointer-events:auto}
#num{font-size:min(30vw,200px);font-weight:900;line-height:1;text-shadow:0 4px 24px #000;transition:color .08s}
#num.hit{color:#f59e0b}
.pill{background:#0009;border-radius:99px;padding:4px 12px;font-size:13px;margin:2px 2px 2px 0;display:inline-block}
#panel{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:#0f172ad9;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;transition:transform .2s}
#panel.hide{transform:translateY(100%)}
button{font:inherit;font-size:13px;background:#334155;color:#fff;border:0;border-radius:8px;padding:8px 12px}
button.on{background:#f59e0b;color:#000;font-weight:700}
input[type=range]{vertical-align:middle;width:110px}
</style>
<script>
/* カメラは最優先で即起動（他の読み込みを待たない） */
const openCam=()=>navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:320},height:{ideal:240},frameRate:{ideal:120}},audio:false});
const camP=openCam();
</script>
<script id="hs" async src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="stage"><video id="cam" autoplay playsinline muted></video><canvas id="cvs"></canvas></div>
<div id="msg">カメラ起動中...</div>
<div id="hud">
  <div><div id="num">0</div><span class="pill">⚡ <b id="bpm">0</b> bpm</span><span class="pill">🔥 <b id="cmb">0</b></span></div>
  <div style="text-align:right"><span class="pill" id="st">認識準備中</span><br><span class="pill" id="hc">0 手検出</span><br><button id="fs">⛶ 全画面</button> <button id="gear">⚙</button></div>
</div>
<div id="panel">
  <button id="m1" class="on">67 交互</button><button id="m2">シンプル上下</button>
  <label>感度(小=高感度) <input id="sv" type="range" min="0.5" max="10" step="0.5" value="1"></label>
  <label>拡大 <input id="zm" type="range" min="1" max="2.5" step=".05" value="1"></label>
  <label><input id="sk" type="checkbox" checked> 骨格</label>
  <label><input id="mt" type="checkbox" checked> 動き補助</label>
  <button id="sd">🔊</button><button id="rs">リセット</button><button id="rc">カメラ再接続</button>
</div>
<script>
const $=id=>document.getElementById(id),v=$('cam'),cv=$('cvs'),g=cv.getContext('2d');
let count=0,combo=0,bpm=0,mode='67',sound=true,last=0,ready=false,busy=false,stream=null,hands=null;
let thr=.01,src=0,hAt=0,pm=null,dir=0,ext=0,prevN=0,lastSeen=0,hist=[],ac=null,pend=false;

/* 効果音 */
addEventListener('pointerdown',()=>{try{ac=ac||new AudioContext();ac.resume()}catch(e){}},{once:true});
function beep(){if(!sound)return;try{ac=ac||new AudioContext();if(ac.state=='suspended')ac.resume();
  const o=ac.createOscillator(),a=ac.createGain(),f=480+(count%15)*25,t=ac.currentTime;
  o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.3,t+.05);
  a.gain.setValueAtTime(.2,t);a.gain.exponentialRampToValueAtTime(.01,t+.05);
  o.connect(a);a.connect(ac.destination);o.start();o.stop(t+.05)}catch(e){}}

/* カウント（最短25ms間隔 = 毎秒40回まで） */
function hit(t){
  if(t-last<25)return;
  count++;
  if(last&&t-last<2500){combo++;bpm=Math.round(bpm*.5+60000/(t-last)*.5)}else{combo=1;bpm=0}
  last=t;beep();
  $('num').textContent=count;$('bpm').textContent=bpm;$('cmb').textContent=combo;
  $('num').classList.add('hit');clearTimeout(hit.t);hit.t=setTimeout(()=>$('num').classList.remove('hit'),80);
}

/* 山・谷の反転検出（フレーム数ではなく振り幅で判定 → 高速でも取りこぼしにくい） */
function track(y,t){
  if(!dir){dir=-1;ext=y;return}
  if(dir>0){ if(y<ext)ext=y; else if(y>ext+thr){dir=-1;ext=y;hit(t)} }
  else     { if(y>ext)ext=y; else if(y<ext-thr){dir=1;ext=y;hit(t)} }
}

function onRes(r){
  const t=performance.now(),L=r.multiHandLandmarks||[],n=L.length;
  if(v.videoWidth&&cv.width!==v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight}
  const w=cv.width,h=cv.height;g.clearRect(0,0,w,h);
  $('hc').textContent=n+' 手検出';
  if(!n){ if(t-lastSeen>300){prevN=0;$('st').textContent='動き検出中'} return }  /* 一瞬の見失い(モーションブラー)は状態を維持 */
  lastSeen=hAt=t;$('st').textContent='高速判定中';
  if(n!==prevN){dir=0;prevN=n}
  const hs=L.map(l=>({l,x:l[9].x,y:(l[0].y+l[5].y+l[9].y+l[13].y+l[17].y)/5})).sort((a,b)=>a.x-b.x);
  const y=(mode=='67'&&n>1)?hs[0].y-hs[1].y:hs.reduce((s,o)=>s+o.y,0)/n;
  feed(y,t,1);
  hist.push(y);if(hist.length>60)hist.shift();
  if($('sk').checked){
    const rad=Math.max(3,w/160);
    hs.forEach((o,i)=>{g.fillStyle=i?'#f72585':'#00f5d4';o.l.forEach(p=>{g.beginPath();g.arc(p.x*w,p.y*h,rad,0,7);g.fill()})});
    const m=hist.reduce((s,a)=>s+a,0)/hist.length;
    g.beginPath();g.strokeStyle='#f59e0b';g.lineWidth=3;
    hist.forEach((a,i)=>{const X=i*w/60,Y=h*.5+(a-m)*h*.8;i?g.lineTo(X,Y):g.moveTo(X,Y)});g.stroke();
  }
}

/* 動き補助：手認識が追いつかない超高速時は、映像の差分から上下動を直接検出（毎フレーム・超軽量） */
const mc=document.createElement('canvas');mc.width=64;mc.height=48;
const mg=mc.getContext('2d',{willReadFrequently:true});
function feed(y,t,s){if(src!==s){src=s;dir=0}track(y,t)}
function motion(t){
  mg.drawImage(v,0,0,64,48);
  const d=mg.getImageData(0,0,64,48).data,o=pm;pm=d;
  if(!o||t-hAt<120)return;
  let s=0,sy=0,l=0,ly=0,rr=0,ry=0;
  for(let y=0;y<48;y++)for(let x=0;x<64;x++){
    const i=(y*64+x)*4;
    if(Math.abs(d[i]-o[i])+Math.abs(d[i+1]-o[i+1])+Math.abs(d[i+2]-o[i+2])>60){s++;sy+=y;if(x<32){l++;ly+=y}else{rr++;ry+=y}}
  }
  if(s<10)return;
  const y=(mode=='67'&&l>=5&&rr>=5)?(ly/l-ry/rr)/48:sy/s/48;
  feed(y,t,2);
}

/* 毎フレーム実行。手認識は空いた時に最新フレームだけを投入（待たない） */
function loop(){
  const t=performance.now();
  if(!v.paused&&v.readyState>=2){
    if($('mt').checked)motion(t);
    if(ready&&!busy){busy=true;hands.send({image:v}).catch(()=>{}).finally(()=>{busy=false})}
  }
  sched();
}
function sched(){
  if(pend)return;pend=true;
  const f=()=>{pend=false;loop()};
  v.requestVideoFrameCallback?v.requestVideoFrameCallback(f):requestAnimationFrame(f);
}

async function start(p){
  $('msg').style.display='';$('msg').textContent='カメラ起動中...';
  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await(p||openCam());v.srcObject=stream;await v.play();
    $('msg').style.display='none';sched();
  }catch(e){$('msg').textContent='カメラの使用を許可してください（タップで再試行）'}
}
start(camP);

/* MediaPipe は裏で並行ロード（カメラ映像はモデルを待たず先に表示） */
new Promise(r=>{window.Hands?r():$('hs').addEventListener('load',r)}).then(async()=>{
  hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});
  hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.3,minTrackingConfidence:.3});
  hands.onResults(onRes);
  await hands.initialize();ready=true;$('st').textContent='手を映してください';
});

/* UI */
function setMode(m){mode=m;dir=0;$('m1').className=m=='67'?'on':'';$('m2').className=m=='67'?'':'on'}
$('m1').onclick=()=>setMode('67');$('m2').onclick=()=>setMode('single');
$('sv').oninput=e=>{thr=e.target.value/100;dir=0};
$('zm').oninput=e=>document.documentElement.style.setProperty('--z',e.target.value);
$('sd').onclick=()=>{sound=!sound;$('sd').textContent=sound?'🔊':'🔇'};
$('rs').onclick=()=>{count=combo=bpm=0;last=0;dir=0;$('num').textContent=0;$('bpm').textContent=0;$('cmb').textContent=0};
$('rc').onclick=()=>start();
$('msg').onclick=()=>start();
$('gear').onclick=()=>$('panel').classList.toggle('hide');
$('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
</script>
</body></html>
